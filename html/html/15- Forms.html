<form action="" method="" enctype="multipart/form-data">
    <h1>digite seu endereço</h1>
     <label>
        Rua:
        <input type="text" name="rua" autocomplete="street-address">
     </label>
     <br>
     <label>
        Número:
        <input type="number" name="rua" autocomplete="address-line1">
     </label>
    <br>
     <label>
        Email:
        <input type="email" name="rua" autocomplete="address-line1">
     </label>
     <br>
     <label>
        Foto:
        <input type="file" name="rua" autocomplete="address-line1">
     </label>
     <br>
     <button type="reset">Resetar</button>
    <br>
     <button type="submit">Enviar dados</button>
</form>
